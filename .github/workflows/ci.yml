name: CI

on:
  push:
  workflow_dispatch:

jobs:
  sast_scan:
    name: Run Bandit Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit Scan
        run: bandit -ll -ii -r . -f json -o bandit-report.json

      - name: Upload Bandit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-findings
          path: bandit-report.json

  image_scan:
    name: Build and Run Image Scan
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: pygoat:${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -f Dockerfile -t "$IMAGE_TAG" .

      # Docker Scout can scan local images anonymously, so no Docker Hub
      # credentials are required. Credentials are only useful for higher pull
      # rate limits; they must be stored as GitHub Secrets (never committed).
      - name: Install Docker Scout CLI
        run: |
          mkdir -p "$HOME/.docker/cli-plugins"
          curl -fsSL https://raw.githubusercontent.com/docker/scout-cli/main/install.sh \
            | sh -s -- -b "$HOME/.docker/cli-plugins"
          docker scout version

      - name: Docker Scout Quickview
        # informational: policy violations are expected for this image
        run: docker scout quickview "local://$IMAGE_TAG" || true

      - name: Docker Scout CVEs (critical, high)
        # --exit-code makes the step fail when vulnerabilities are found:
        # a red pipeline is expected for this intentionally vulnerable image
        run: |
          docker scout cves --only-severity critical,high --exit-code \
            --format sarif --output scout-report.sarif \
            "local://$IMAGE_TAG"

      - name: Generate readable Scout report
        if: always()
        run: python3 .github/scripts/scout_sarif_summary.py scout-report.sarif scout-report.md

      - name: Upload Docker Scout Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-scout-findings
          path: |
            scout-report.sarif
            scout-report.md

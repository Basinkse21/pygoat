name: CI

on:
  push:
  workflow_dispatch:

jobs:
  sast_scan:
    name: Run Bandit Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit Scan
        run: bandit -ll -ii -r . -f json -o bandit-report.json

      - name: Upload Bandit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-findings
          path: bandit-report.json

  image_scan:
    name: Build and Run Image Scan
    runs-on: ubuntu-latest

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
      IMAGE_TAG: pygoat:${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Docker Scout requires authentication on GitHub-hosted runners.
      # The credentials live in GitHub Secrets, never in the repository.
      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_PASSWORD }}

      - name: Build Docker Image
        run: docker build -f Dockerfile -t "$IMAGE_TAG" .

      - name: Docker Scout Scan
        uses: docker/scout-action@v1.15.1
        with:
          dockerhub-user: ${{ env.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ env.DOCKERHUB_PASSWORD }}
          image: ${{ env.IMAGE_TAG }}
          command: quickview,cves
          only-severities: critical,high
          sarif-file: scout-report.sarif
          summary: true
          write-comment: false
          # fail the step when critical/high vulnerabilities are detected:
          # a red pipeline is expected for this intentionally vulnerable image
          exit-code: true

      - name: Generate readable Scout report
        if: always()
        run: python3 .github/scripts/scout_sarif_summary.py scout-report.sarif scout-report.md

      - name: Upload Docker Scout Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-scout-findings
          path: |
            scout-report.sarif
            scout-report.md

  dast_scan:
    name: Run OWASP ZAP Passive Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      ZAP_IMAGE: ghcr.io/zaproxy/zaproxy@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build and start PyGoat
        shell: bash
        run: |
          docker build -t pygoat-dast:${GITHUB_SHA} .
          docker network create --internal pygoat-dast
          docker run --detach --network pygoat-dast --network-alias web \
            --name pygoat-dast-web pygoat-dast:${GITHUB_SHA}
          for attempt in {1..30}; do
            if docker exec pygoat-dast-web curl -fsS --max-time 3 http://127.0.0.1:8000/login/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs pygoat-dast-web
          exit 1
      - name: Run passive DAST
        shell: bash
        run: |
          install -d -m 0777 zap-out
          docker run --rm --network pygoat-dast \
            --mount "type=bind,src=$GITHUB_WORKSPACE/.github/zap-passive.yaml,dst=/zap/zap-passive.yaml,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/zap-out,dst=/zap/wrk" \
            "$ZAP_IMAGE" zap.sh -cmd -silent -autorun /zap/zap-passive.yaml | tee zap-out/zap-run.log
          test -s zap-out/zap-report.json
          test -s zap-out/zap-report.html
      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-out/
      - name: Remove DAST containers and network
        if: always()
        run: |
          docker rm -f pygoat-dast-web || true
          docker network rm pygoat-dast || true
